name: publish-container

on:
  push:
    branches: [codex/warnbridge-initial]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warnbridge-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: ./scripts/setup.sh
      - run: ./scripts/validate.sh
      - run: docker compose config --quiet
      - run: docker compose -f compose.live.yaml config --quiet
      - run: docker compose -f compose.deploy.yaml config --quiet

  publish:
    needs: validate
    if: >-
      github.repository == 'bho18/atsc_warn' &&
      github.ref == 'refs/heads/codex/warnbridge-initial' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bho18/warnbridge
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find an existing immutable revision
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          query=".[] | select(.metadata.container.tags | index(\"${SHA_TAG}\")) | .name"
          if digest=$(gh api --paginate \
            '/users/bho18/packages/container/warnbridge/versions?per_page=100' \
            --jq "$query" 2>"$RUNNER_TEMP/warnbridge-package-error"); then
            if [[ -n "$digest" ]]; then
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/warnbridge-package-error"; then
            cat "$RUNNER_TEMP/warnbridge-package-error" >&2
            exit 1
          fi
      - name: Build and publish the immutable revision
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          labels: |
            org.opencontainers.image.title=WarnBridge
            org.opencontainers.image.description=Experimental offline-first PBS WARN receiver
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Promote the tested revision to edge
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          head=$(git ls-remote origin refs/heads/codex/warnbridge-initial | cut -f1)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
            promotion="Promoted this revision to edge."
          else
            promotion="A newer source commit exists; edge was not changed."
          fi
          {
            echo '### Published WarnBridge image'
            echo
            echo "Revision: \`$IMAGE:$SHA_TAG\`"
            echo "Rolling update channel: \`$IMAGE:edge\`"
            echo "Pinned digest: \`$IMAGE@$DIGEST\`"
            echo "$promotion"
          } >> "$GITHUB_STEP_SUMMARY"
